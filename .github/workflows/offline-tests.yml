name: offline-tests

on:
  push:
    branches:
      - main
      - onsite-2026
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Competition-day pushes can arrive in quick succession. Only the newest run
# for a branch/ref is useful; cancel stale work instead of queueing redundant
# checkout/setup/install cycles.
concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q steadyhand tools
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
